version: "3.9"

services:
  # credential-storage:
  #   build: .
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     cassandra:
  #       condition: service_healthy
  #     openbao:
  #       condition: service_healthy
  #   environment:
  #     VAULT_ADDR: http://openbao:8200
  #     VAULT_TOKEN: dev-root-token
  #   networks:
  #     - xfsc

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - xfsc

  openbao:
    image: openbao/openbao:latest
    command: server -dev -dev-root-token-id=dev-root-token
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: http://0.0.0.0:8200
      BAO_API_ADDR: http://openbao:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - xfsc

networks:
  xfsc:
    driver: bridge
