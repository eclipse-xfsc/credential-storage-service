  #   networks:
  #     - xfsc

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - xfsc

  openbao:
    image: openbao/openbao:latest
    command: server -dev -dev-root-token-id=dev-root-token
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: http://0.0.0.0:8200
      BAO_API_ADDR: http://openbao:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - xfsc

  crypto-provider:
    image: node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/tsa/crypto-provider-hashicorp-vault-plugin@sha256:b65581777a9fc28d3aac5757e7125d8e996132753826d55740207166a3aff0bd
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      CRYPTO_GRPC_ADDR: 0.0.0.0:50051
      VAULT_ADRESS: http://openbao:8200
      VAULT_TOKEN: dev-root-token
    expose:
      - "50051"
    ports:
      - "50051:50051"
    networks:
      - xfsc

networks:
  xfsc:
    driver: bridge
