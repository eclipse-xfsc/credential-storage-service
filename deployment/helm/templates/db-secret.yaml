{{- $secretName := printf "%s-cassandra-credentials" .Release.Name -}}
{{- $externalSecretName := printf "%s-cassandra-credentials" .Release.Name -}}
{{- $remoteKey := printf "ocm-wstack/cassandra/%s" .Release.Name -}}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $externalSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete

  data:
    - secretKey: username
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: username

    - secretKey: password
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: password