apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.name" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}

      containers:
        #
        # Credential Storage Service
        #
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy | quote }}

          ports:
            - name: http
              containerPort: {{ .Values.server.http.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /v1/metrics/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5

          {{- with .Values.config.arguments }}
          args:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}

          env:
            - name: STORAGESERVICE_CASSANDRA_HOST
              value: {{ .Values.config.cassandra.hosts | quote }}

            - name: STORAGESERVICE_CASSANDRA_USER
              value: {{ .Values.config.cassandra.user | quote }}

            - name: STORAGESERVICE_CASSANDRA_KEYSPACE
              value: {{ .Values.config.cassandra.keyspace | quote }}

            - name: STORAGESERVICE_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.cassandra.passwordSecret }}
                  key: {{ .Values.config.cassandra.passwordKey }}

            - name: LISTEN_PORT
              value: {{ .Values.server.http.port | quote }}

            - name: LISTEN_ADDR
              value: {{ .Values.server.http.address | quote }}

            - name: STORAGESERVICE_PROFILE
              value: {{ .Values.config.service.profiles | quote }}

            - name: STORAGESERVICE_LOG_LEVEL
              value: {{ .Values.config.service.logLevel | quote }}

            - name: STORAGESERVICE_MODE
              value: {{ .Values.config.service.mode | quote }}

            #
            # Crypto Provider gRPC connection
            #
            # Both containers run in the same Pod and therefore share
            # the localhost network namespace.
            #
            - name: STORAGESERVICE_CRYPTO_GRPC_ADDR
              value: "127.0.0.1:{{ .Values.config.crypto.grpc.port }}"

            - name: STORAGESERVICE_CRYPTO_NAMESPACE
              value: {{ .Values.config.crypto.namespace | quote }}

            - name: STORAGESERVICE_CRYPTO_SIGNKEY
              value: {{ .Values.config.crypto.signKey | quote }}

            - name: STORAGESERVICE_NATS_STORAGETOPIC
              value: {{ .Values.config.messaging.storageTopic | quote }}

            - name: STORAGESERVICE_NATS_URL
              value: {{ .Values.config.messaging.url | quote }}

            - name: STORAGESERVICE_NATS_QUEUEGROUP
              value: {{ .Values.config.messaging.queueGroup | quote }}

            - name: STORAGESERVICE_NATS_REQUEST_TIMEOUT
              value: {{ .Values.config.messaging.queueGroup | quote }}
              

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        #
        # Crypto Provider gRPC sidecar
        #
        - name: crypto-provider
          image: "{{ .Values.config.crypto.image.repository }}/{{ .Values.config.crypto.image.name }}:{{ .Values.config.crypto.image.tag }}"
          imagePullPolicy: {{ .Values.config.crypto.image.pullPolicy | default "IfNotPresent" | quote }}

          ports:
            - name: crypto-grpc
              containerPort: {{ .Values.config.crypto.grpc.port }}
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: crypto-grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1

          env:
            - name: GRPC_HOST
              value: "0.0.0.0"

            - name: GRPC_PORT
              value: {{ .Values.config.crypto.grpc.port | quote }}

            - name: CRYPTO_PROVIDER_NAMESPACE
              value: {{ .Values.config.crypto.namespace | quote }}

            {{- with .Values.config.crypto.arguments }}
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}

            {{- with .Values.config.vault }}
            - name: VAULT_ADDR
              value: {{ .address | quote }}

            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenName }}
                  key: {{ .tokenKey }}
            {{- end }}

          {{- with .Values.config.crypto.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}