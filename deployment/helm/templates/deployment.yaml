apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.name" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}

      containers:
        #
        # Credential Storage Service
        #
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy | quote }}

          ports:
            - name: http
              containerPort: {{ .Values.server.http.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /v1/metrics/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5

          {{- with .Values.config.arguments }}
          args:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}

          env:
            {{- $podAnnotations := default dict .Values.podAnnotations }}
            {{- $injectionEnabled := eq (default "false" (index $podAnnotations "inject.xfsc.io/enabled")) "true" }}

            #
            # Cassandra and NATS are injected when inject.xfsc.io/enabled=true.
            # Otherwise they are configured explicitly from values.yaml.
            #
            {{- if not $injectionEnabled }}
            - name: STORAGESERVICE_CASSANDRA_HOSTS
              value: {{ .Values.config.cassandra.hosts | quote }}

            - name: STORAGESERVICE_CASSANDRA_USER
              value: {{ .Values.config.cassandra.user | quote }}

            - name: STORAGESERVICE_CASSANDRA_KEYSPACE
              value: {{ .Values.config.cassandra.keyspace | quote }}

            - name: STORAGESERVICE_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.cassandra.passwordSecret }}
                  key: {{ .Values.config.cassandra.passwordKey }}

            - name: STORAGESERVICE_NATS_URL
              value: {{ .Values.config.messaging.url | quote }}

            - name: STORAGESERVICE_NATS_QUEUEGROUP
              value: {{ .Values.config.messaging.queueGroup | quote }}

            - name: STORAGESERVICE_NATS_REQUEST_TIMEOUT
              value: {{ .Values.config.messaging.requestTimeout | quote }}
            {{- end }}

            {{- if $injectionEnabled  }}
            - name: STORAGESERVICE_CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: username

            - name: STORAGESERVICE_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: password

             {{- end }}

            - name: STORAGESERVICE_NATS_STORAGETOPIC
              value: {{ .Values.config.messaging.storageTopic | quote }}


            - name: LISTEN_PORT
              value: {{ .Values.server.http.port | quote }}

            - name: LISTEN_ADDR
              value: {{ .Values.server.http.address | quote }}

            - name: STORAGESERVICE_PROFILE
              value: {{ .Values.config.service.profiles | quote }}

            - name: STORAGESERVICE_LOG_LEVEL
              value: {{ .Values.config.service.logLevel | quote }}

            - name: STORAGESERVICE_MODE
              value: {{ .Values.config.service.mode | quote }}

            #
            # Crypto Provider gRPC connection.
            # Both containers share the Pod network namespace.
            #
            - name: STORAGESERVICE_CRYPTO_GRPC_ADDR
              value: {{ .Values.config.engine.clusterAddress | quote }}

            - name: STORAGESERVICE_CRYPTO_NAMESPACE
              value: {{ .Values.config.crypto.namespace | quote }}

            - name: STORAGESERVICE_CRYPTO_SIGNKEY
              value: {{ .Values.config.crypto.signKey | quote }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        #
        # Crypto Provider gRPC sidecar
        #
        - name: crypto-provider
          image: {{ .Values.config.engine.image | quote }}
          imagePullPolicy: {{ .Values.config.engine.pullPolicy | default "IfNotPresent" | quote }}

          {{- $grpcAddressParts := splitList ":" .Values.config.engine.address }}
          {{- $grpcPort := last $grpcAddressParts }}

          ports:
            - name: crypto-grpc
              containerPort: {{ $grpcPort }}
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: crypto-grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1

          env:
            - name: CRYPTO_GRPC_ADDR
              value: {{ .Values.config.engine.address | quote }}

            {{- range $name, $value := .Values.config.engine.env }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}

            {{- range $name, $secret := .Values.config.engine.secretEnv }}
            - name: {{ $name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
            {{- end }}

          {{- with .Values.config.engine.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}