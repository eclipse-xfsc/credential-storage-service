{{- if eq (index .Values.podAnnotations "inject.xfsc.io/enabled") "true" }}
apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceProvider
metadata:
  name: storageservice
spec:
  type: storageservice
  scope: {{ .Values.resourceProvider.scope | quote }}
  description: {{ .Values.resourceProvider.description | quote }}
{{- with .Values.resourceProvider.allow.namespaces }}
  allow:
    namespaces:
{{ toYaml . | indent 6 }}
{{- end }}
  outputs:
    env:
      STORAGE_URL: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "app.name" .) .Release.Namespace .Values.service.port | quote }}
      STORAGE_TOPIC: {{ .Values.config.messaging.storageTopic }}    
{{- end }}